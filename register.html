<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GDJSS Central Class of 2021 - Registration</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f6f9;
    color:#222;
    padding:20px 15px;
}

.container{
    max-width:600px;
    margin:auto;
}

.header{
    background:#0b3d2e;
    color:white;
    text-align:center;
    padding:25px 15px;
    border-radius:15px 15px 0 0;
}

.header h1{
    margin:0 0 8px;
    font-size:22px;
}

.header p{
    margin:0;
}

.card{
    background:white;
    padding:25px;
    border-radius:0 0 15px 15px;
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-top:14px;
    margin-bottom:6px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    margin-top:18px;
    border:0;
    border-radius:8px;
    background:#0b3d2e;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

.secondary{
    background:#555;
}

.message{
    margin-top:18px;
    padding:14px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    line-height:1.5;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.success{
    background:#d1e7dd;
    color:#0f5132;
}

.error{
    background:#f8d7da;
    color:#842029;
}

.hidden{
    display:none;
}

.footer{
    text-align:center;
    color:#666;
    font-size:13px;
    margin-top:18px;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
GDJSS CENTRAL CLASS OF 2021
</h1>

<p>
Member Registration
</p>

</div>


<div class="card">


<!-- REGISTRATION FORM -->

<form id="registrationForm">


<label>Full Name</label>

<input
type="text"
id="fullName"
required
>


<label>Phone Number</label>

<input
type="tel"
id="phone"
required
>


<label>Gender</label>

<select
id="gender"
required
>

<option value="">
Select Gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>


<label>State</label>

<input
type="text"
id="state"
required
>


<label>City / Town</label>

<input
type="text"
id="city"
required
>


<label>Current Address</label>

<textarea
id="address"
required
></textarea>


<label>Class / Section</label>

<input
type="text"
id="classSection"
required
>


<label>WhatsApp Number</label>

<input
type="tel"
id="whatsapp"
required
>


<label>Occupation</label>

<input
type="text"
id="occupation"
required
>


<label>Email</label>

<input
type="email"
id="email"
required
>


<label>Passport Photo</label>

<input
type="file"
id="photo"
accept="image/*"
required
>


<button
type="submit"
id="submitButton"
>

Submit Registration

</button>

</form>


<!-- MESSAGE -->

<div
id="message"
class="message hidden"
></div>


<!-- PENDING -->

<div
id="pendingSection"
class="hidden"
>

<div
class="message pending"
>

⏳ Your registration has been submitted.

<br><br>

Please wait for Admin approval.

</div>


<button
type="button"
id="checkButton"
class="secondary"
>

Check Approval Status

</button>

</div>


<!-- APPROVED -->

<div
id="approvedSection"
class="hidden"
>

<div
class="message success"
>

✅ Registration Approved!

<br><br>

Your registration has been approved by Admin.

<br><br>

You can now create/login to your GDJSS member account.

</div>


<button
type="button"
id="nextButton"
>

Next — Member Login

</button>

</div>


</div>


<div class="footer">

GDJSS Central Class of 2021 Association

</div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://nfivwaxynfcqumupcttp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";


const db =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   REGISTRATION KEY
========================================= */

const REGISTRATION_KEY =
"gdjss_2021_registration_id";


/* =========================================
   ELEMENTS
========================================= */

const form =
document.getElementById(
    "registrationForm"
);

const message =
document.getElementById(
    "message"
);

const pendingSection =
document.getElementById(
    "pendingSection"
);

const approvedSection =
document.getElementById(
    "approvedSection"
);

const submitButton =
document.getElementById(
    "submitButton"
);

const checkButton =
document.getElementById(
    "checkButton"
);

const nextButton =
document.getElementById(
    "nextButton"
);


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
    text,
    type
){

    message.className =
        "message " + type;

    message.textContent =
        text;

}


/* =========================================
   SHOW PENDING
========================================= */

function showPending(){

    form.classList.add(
        "hidden"
    );

    message.classList.add(
        "hidden"
    );

    pendingSection.classList.remove(
        "hidden"
    );

    approvedSection.classList.add(
        "hidden"
    );

}


/* =========================================
   SHOW APPROVED
========================================= */

function showApproved(){

    form.classList.add(
        "hidden"
    );

    pendingSection.classList.add(
        "hidden"
    );

    approvedSection.classList.remove(
        "hidden"
    );

}


/* =========================================
   SHOW FORM
========================================= */

function showForm(){

    form.classList.remove(
        "hidden"
    );

    pendingSection.classList.add(
        "hidden"
    );

    approvedSection.classList.add(
        "hidden"
    );

}


/* =========================================
   SUBMIT REGISTRATION
========================================= */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        submitButton.disabled =
            true;

        showMessage(
            "Submitting your registration...",
            "pending"
        );


        try{

            const photo =
                document.getElementById(
                    "photo"
                ).files[0];


            if(!photo){

                throw new Error(
                    "Please select your passport photo."
                );

            }


            /*
             * Generate unique registration ID
             */

            const registrationId =
                Date.now();


            /*
             * Upload photo
             */

            const fileName =
                registrationId +
                "-" +
                photo.name.replace(
                    /[^a-zA-Z0-9.-]/g,
                    "_"
                );


            const uploadResult =
                await db
                .storage
                .from("member-photos")
                .upload(
                    fileName,
                    photo,
                    {
                        upsert:true
                    }
                );


            if(uploadResult.error){

                throw uploadResult.error;

            }


            /*
             * Get public photo URL
             */

            const publicUrlResult =
                db
                .storage
                .from("member-photos")
                .getPublicUrl(
                    fileName
                );


            const photoUrl =
                publicUrlResult
                .data
                .publicUrl;


            /*
             * Insert registration
             */

            const registrationData = {

                id:
                    registrationId,

                full_name:
                    document.getElementById(
                        "fullName"
                    ).value.trim(),

                phone:
                    document.getElementById(
                        "phone"
                    ).value.trim(),

                gender:
                    document.getElementById(
                        "gender"
                    ).value,

                state:
                    document.getElementById(
                        "state"
                    ).value.trim(),

                city:
                    document.getElementById(
                        "city"
                    ).value.trim(),

                address:
                    document.getElementById(
                        "address"
                    ).value.trim(),

                class_section:
                    document.getElementById(
                        "classSection"
                    ).value.trim(),

                whatsapp:
                    document.getElementById(
                        "whatsapp"
                    ).value.trim(),

                occupation:
                    document.getElementById(
                        "occupation"
                    ).value.trim(),

                email:
                    document.getElementById(
                        "email"
                    ).value.trim()
                    .toLowerCase(),

                photo_url:
                    photoUrl,

                status:
                    "pending"

            };


            /*
             * IMPORTANT:
             * Do not use .select() here.
             */

            const insertResult =
                await db
                .from("registrations")
                .insert(
                    registrationData
                );


            if(insertResult.error){

                throw insertResult.error;

            }


            /*
             * Save registration ID
             */

            localStorage.setItem(
                REGISTRATION_KEY,
                registrationId.toString()
            );


            showPending();


        }catch(error){

            console.error(
                "REGISTRATION ERROR:",
                error
            );


            showMessage(
                "❌ " +
                (
                    error.message ||
                    "Registration failed."
                ),
                "error"
            );


            submitButton.disabled =
                false;

        }

    }
);


/* =========================================
   CHECK APPROVAL
========================================= */

checkButton.addEventListener(
    "click",
    checkApproval
);


async function checkApproval(){

    const registrationId =
        localStorage.getItem(
            REGISTRATION_KEY
        );


    if(!registrationId){

        showForm();

        return;

    }


    checkButton.disabled =
        true;

    checkButton.textContent =
        "Checking...";


    try{

        const result =
            await db
            .from("registrations")
            .select(
                "id,status,member_id"
            )
            .eq(
                "id",
                registrationId
            )
            .maybeSingle();


        if(result.error){

            throw result.error;

        }


        const registration =
            result.data;


        if(!registration){

            throw new Error(
                "Registration record was not found."
            );

        }


        if(
            registration.status ===
            "approved"
        ){

            showApproved();

            return;

        }


        if(
            registration.status ===
            "rejected"
        ){

            showMessage(
                "❌ Your registration was rejected by Admin.",
                "error"
            );

            return;

        }


        showMessage(
            "⏳ Your registration is still waiting for Admin approval.",
            "pending"
        );

        pendingSection.classList.remove(
            "hidden"
        );

    }catch(error){

        console.error(
            error
        );


        showMessage(
            "❌ " +
            (
                error.message ||
                "Unable to check approval."
            ),
            "error"
        );

    }


    checkButton.disabled =
        false;

    checkButton.textContent =
        "Check Approval Status";

}


/* =========================================
   NEXT
   APPROVED → MEMBER LOGIN
========================================= */

nextButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "member-login.html";

    }
);


/* =========================================
   CHECK SAVED REGISTRATION
========================================= */

async function checkSavedRegistration(){

    const registrationId =
        localStorage.getItem(
            REGISTRATION_KEY
        );


    if(!registrationId){

        showForm();

        return;

    }


    try{

        const result =
            await db
            .from("registrations")
            .select(
                "id,status,member_id"
            )
            .eq(
                "id",
                registrationId
            )
            .maybeSingle();


        if(result.error){

            showPending();

            return;

        }


        if(!result.data){

            localStorage.removeItem(
                REGISTRATION_KEY
            );

            showForm();

            return;

        }


        if(
            result.data.status ===
            "approved"
        ){

            showApproved();

        }else{

            showPending();

        }

    }catch(error){

        console.error(
            error
        );

        showPending();

    }

}


/* =========================================
   START
========================================= */

checkSavedRegistration();

</script>

</body>
</html>
