<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GDJSS CENTRAL CLASS OF 2021 - Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #061b3a, #0b4f9c);
      min-height: 100vh;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 650px;
      margin: auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: #064b9b;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
      color: #123;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0b63ce;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .btn {
      width: 100%;
      padding: 14px;
      margin-top: 22px;
      border: none;
      border-radius: 10px;
      background: #075fc4;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #064d9e;
    }

    .secondary {
      background: #555;
    }

    .secondary:hover {
      background: #333;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      font-size: 14px;
    }

    .success {
      background: #dff6e7;
      color: #176b37;
    }

    .error {
      background: #ffe0e0;
      color: #9b111e;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .approved {
      background: #d1f7df;
      color: #146c36;
    }

    .rejected {
      background: #ffdede;
      color: #9b111e;
    }

    .status-box {
      margin-top: 25px;
      display: none;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
    }

    .status-box h3 {
      margin-bottom: 8px;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 8px;
      line-height: 1.5;
    }

    .required {
      color: red;
    }

    .photo-note {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 18px;
      }

      .header h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>GDJSS CENTRAL CLASS OF 2021</h1>
    <p>Member Registration</p>
  </div>

  <form id="registrationForm">

    <label>
      Full Name <span class="required">*</span>
    </label>
    <input
      type="text"
      id="full_name"
      placeholder="Enter your full name"
      required
    />

    <label>
      Phone Number <span class="required">*</span>
    </label>
    <input
      type="tel"
      id="phone"
      placeholder="08012345678"
      required
    />

    <label>
      Gender <span class="required">*</span>
    </label>
    <select id="gender" required>
      <option value="">Select Gender</option>
      <option value="Male">Male</option>
      <option value="Female">Female</option>
    </select>

    <label>
      State <span class="required">*</span>
    </label>
    <input
      type="text"
      id="state"
      placeholder="Enter your state"
      required
    />

    <label>
      City / Town <span class="required">*</span>
    </label>
    <input
      type="text"
      id="city"
      placeholder="Enter city or town"
      required
    />

    <label>
      Current Address <span class="required">*</span>
    </label>
    <textarea
      id="address"
      placeholder="Enter your current address"
      required
    ></textarea>

    <label>
      Class / Section <span class="required">*</span>
    </label>
    <input
      type="text"
      id="class_section"
      placeholder="Example: Class C"
      required
    />

    <label>
      WhatsApp Number
    </label>
    <input
      type="tel"
      id="whatsapp"
      placeholder="Enter WhatsApp number"
    />

    <label>
      Occupation
    </label>
    <input
      type="text"
      id="occupation"
      placeholder="Example: Business, Student, Teacher..."
    />

    <label>
      Email <span class="required">*</span>
    </label>
    <input
      type="email"
      id="email"
      placeholder="example@gmail.com"
      required
    />

    <label>
      Passport Photo
    </label>
    <input
      type="file"
      id="photo"
      accept="image/*"
    />

    <div class="photo-note">
      Passport photo is optional at this stage.
    </div>

    <button type="submit" class="btn" id="submitButton">
      Submit Registration
    </button>

  </form>

  <div id="message" class="message"></div>

  <div id="statusBox" class="status-box">

    <h3 id="statusTitle"></h3>

    <p id="statusText"></p>

    <p class="small" id="registrationNumber"></p>

    <button
      type="button"
      class="btn"
      id="checkStatusButton"
    >
      Check Approval Status
    </button>

    <button
      type="button"
      class="btn"
      id="nextButton"
      style="display:none;"
    >
      Next
    </button>

  </div>

</div>


<script>

  /* ===============================
