<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GDJSS CENTRAL CLASS OF 2021</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f6fb;
      color: #222;
    }

    .header {
      background: #0757a0;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .header p {
      margin: 7px 0 0;
      font-size: 14px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.10);
    }

    h2 {
      text-align: center;
      color: #0757a0;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      width: 100%;
      border: 0;
      padding: 13px;
      margin-top: 20px;
      border-radius: 8px;
      background: #0757a0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #dff5e5;
      color: #176b35;
    }

    .error {
      display: block;
      background: #ffe1e1;
      color: #a00000;
    }

    .pending {
      display: block;
      background: #fff3cd;
      color: #765900;
    }

    .approved {
      display: block;
      background: #dff5e5;
      color: #176b35;
    }

    .rejected {
      display: block;
      background: #ffe1e1;
      color: #a00000;
    }

    #statusSection {
      display: none;
      margin-top: 20px;
    }

    .small {
      text-align: center;
      font-size: 13px;
      color: #666;
      margin-top: 8px;
    }

    .nextBtn {
      background: #198754;
    }

    .nextBtn:hover {
      background: #146c43;
    }

    .checkBtn {
      background: #555;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>GDJSS CENTRAL CLASS OF 2021</h1>
    <p>Association Member Registration</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>Member Registration</h2>

      <form id="registrationForm">

        <label>Full Name *</label>
        <input
          type="text"
          id="full_name"
          required
          placeholder="Enter full name"
        >

        <label>Phone Number *</label>
        <input
          type="tel"
          id="phone"
          required
          placeholder="08012345678"
        >

        <label>Gender *</label>
        <select id="gender" required>
          <option value="">Select Gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>

        <label>State *</label>
        <input
          type="text"
          id="state"
          required
          placeholder="Enter state"
        >

        <label>City / Town *</label>
        <input
          type="text"
          id="city"
          required
          placeholder="Enter city or town"
        >

        <label>Current Address *</label>
        <textarea
          id="address"
          required
          placeholder="Enter current address"
        ></textarea>

        <label>Class / Section *</label>
        <input
          type="text"
          id="class_section"
          required
          placeholder="Example: Class C"
        >

        <label>WhatsApp Number</label>
        <input
          type="tel"
          id="whatsapp"
          placeholder="WhatsApp number"
        >

        <label>Occupation</label>
        <input
          type="text"
          id="occupation"
          placeholder="Your occupation"
        >

        <label>Email *</label>
        <input
          type="email"
          id="email"
          required
          placeholder="example@gmail.com"
        >

        <label>Passport Photo</label>
        <input
          type="file"
          id="photo"
          accept="image/*"
        >

        <button type="submit" id="submitButton">
          Submit Registration
        </button>

      </form>


      <div id="message" class="message"></div>


      <div id="statusSection">

        <div id="statusMessage" class="message"></div>

        <div class="small" id="registrationInfo"></div>

        <button
          type="button"
          id="checkStatusButton"
          class="checkBtn"
        >
          Check Approval Status
        </button>

        <button
          type="button"
          id="nextButton"
          class="nextBtn"
          style="display:none;"
        >
          Next
        </button>

      </div>

    </div>

  </div>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://nfivwaxynfcqumupcttp.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_cW8I1UvkW1jvGNDeh_NTPg_QicAc9G7";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     REGISTRATION STORAGE KEY
  ================================= */

  const REGISTRATION_KEY =
    "gdjss_2021_registration_id";


  /* ================================
     ELEMENTS
  ================================= */

  const form =
    document.getElementById(
      "registrationForm"
    );

  const submitButton =
    document.getElementById(
      "submitButton"
    );

  const message =
    document.getElementById(
      "message"
    );

  const statusSection =
    document.getElementById(
      "statusSection"
    );

  const statusMessage =
    document.getElementById(
      "statusMessage"
    );

  const registrationInfo =
    document.getElementById(
      "registrationInfo"
    );

  const checkStatusButton =
    document.getElementById(
      "checkStatusButton"
    );

  const nextButton =
    document.getElementById(
      "nextButton"
    );


  /* ================================
     MESSAGE
  ================================= */

  function showMessage(
    element,
    text,
    type
  ) {

    element.textContent = text;

    element.className =
      "message " + type;

  }


  /* ================================
     SUBMIT REGISTRATION
  ================================= */

  form.addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();


      submitButton.disabled = true;

      submitButton.textContent =
        "Submitting...";

      message.style.display =
        "none";


      try {

        /*
         * Old working registration ID
         */

        const registrationId =
          Date.now();


        /*
         * Get form values
         */

        const full_name =
          document
            .getElementById("full_name")
            .value
            .trim();

        const phone =
          document
            .getElementById("phone")
            .value
            .trim();

        const gender =
          document
            .getElementById("gender")
            .value;

        const state =
          document
            .getElementById("state")
            .value
            .trim();

        const city =
          document
            .getElementById("city")
            .value
            .trim();

        const address =
          document
            .getElementById("address")
            .value
            .trim();

        const class_section =
          document
            .getElementById("class_section")
            .value
            .trim();

        const whatsapp =
          document
            .getElementById("whatsapp")
            .value
            .trim();

        const occupation =
          document
            .getElementById("occupation")
            .value
            .trim();

        const email =
          document
            .getElementById("email")
            .value
            .trim();


        /*
         * IMPORTANT:
         * Ba mu yin Storage upload a nan.
         * Wannan shi ne abin da ya hana
         * RLS error na photo.
         */

        const registrationData = {

          id: registrationId,

          full_name: full_name,

          phone: phone,

          gender: gender,

          state: state,

          city: city,

          address: address,

          class_section: class_section,

          whatsapp: whatsapp,

          occupation: occupation,

          email: email,

          status: "pending"

        };


        /*
         * INSERT ONLY
         *
         * Kada a saka .select()
         */

        const { error } =
          await db
            .from("registrations")
            .insert(
              registrationData
            );


        if (error) {

          console.error(
            "Registration error:",
            error
          );

          throw error;

        }


        /*
         * Save registration ID
         */

        localStorage.setItem(
          REGISTRATION_KEY,
          String(registrationId)
        );


        /*
         * Success
         */

        form.style.display =
          "none";


        showMessage(
          message,
          "Registration submitted successfully. Please wait for admin approval.",
          "success"
        );

        message.style.display =
          "block";


        statusSection.style.display =
          "block";


        showStatus(
          "pending",
          null,
          registrationId
        );


      } catch (error) {

        console.error(error);


        message.style.display =
          "block";


        showMessage(
          message,
          error.message ||
          "Registration failed. Please try again.",
          "error"
        );


      } finally {

        submitButton.disabled =
          false;

        submitButton.textContent =
          "Submit Registration";

      }

    }
  );


  /* ================================
     SHOW STATUS
  ================================= */

  function showStatus(
    status,
    memberId,
    registrationId
  ) {

    if (
      status === "approved"
    ) {

      showMessage(
        statusMessage,
        "Registration Approved",
        "approved"
      );


      if (memberId) {

        registrationInfo.textContent =
          "Registration ID: " +
          registrationId +
          " | Member ID: " +
          memberId;

      } else {

        registrationInfo.textContent =
          "Registration ID: " +
          registrationId;

      }


      nextButton.style.display =
        "block";

    }

    else if (
      status === "rejected"
    ) {

      showMessage(
        statusMessage,
        "Registration Rejected. Please contact the administrator.",
        "rejected"
      );


      registrationInfo.textContent =
        "Registration ID: " +
        registrationId;


      nextButton.style.display =
        "none";

    }

    else {

      showMessage(
        statusMessage,
        "Pending Admin Approval. Please wait for the administrator to review your registration.",
        "pending"
      );


      registrationInfo.textContent =
        "Registration ID: " +
        registrationId;


      nextButton.style.display =
        "none";

    }

  }


  /* ================================
     CHECK APPROVAL STATUS
  ================================= */

  checkStatusButton.addEventListener(
    "click",
    async function() {

      const registrationId =
        localStorage.getItem(
          REGISTRATION_KEY
        );


      if (!registrationId) {

        showMessage(
          message,
          "No registration found on this device.",
          "error"
        );

        message.style.display =
          "block";

        return;

      }


      checkStatusButton.disabled =
        true;

      checkStatusButton.textContent =
        "Checking...";


      try {

        const { data, error } =
          await db
            .from("registrations")
            .select(
              "status, member_id"
            )
            .eq(
              "id",
              registrationId
            )
            .maybeSingle();


        if (error) {

          throw error;

        }


        if (!data) {

          showMessage(
            message,
            "Registration not found.",
            "error"
          );

          message.style.display =
            "block";

          return;

        }


        statusSection.style.display =
          "block";


        showStatus(
          data.status,
          data.member_id,
          registrationId
        );


      } catch (error) {

        console.error(error);


        showMessage(
          message,
          error.message ||
          "Unable to check registration status.",
          "error"
        );

        message.style.display =
          "block";

      } finally {

        checkStatusButton.disabled =
          false;

        checkStatusButton.textContent =
          "Check Approval Status";

      }

    }
  );


  /* ================================
